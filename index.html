<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sentry Workshop</title>
<style>body{margin:0;background:#101820;color:#e4edf1;font:15px system-ui}header{padding:24px 28px;border-bottom:1px solid #36434c}h1{margin:0 0 8px;font-size:26px}p{color:#9eb1bd;margin:6px 0}main{display:grid;grid-template-columns:270px 1fr;height:calc(100vh - 118px)}aside{padding:24px;overflow:auto}label{display:block;margin:20px 0 8px}select,button,a{background:#263740;color:#e4edf1;border:1px solid #4c626f;border-radius:6px;padding:9px;font:inherit}select,input[type=range]{width:100%}a{display:inline-block;margin-top:24px;text-decoration:none}#stage{position:relative;min-height:400px}canvas{display:block;width:100%;height:100%}#status{position:absolute;bottom:20px;left:20px;pointer-events:none}button{margin-top:16px;cursor:pointer}@media(max-width:650px){main{grid-template-columns:1fr;height:auto}aside{padding:12px 24px}#stage{height:60vh}}</style>
<header><h1>Sentry Workshop <span style="color:#6bd9ec">/ 18</span></h1><p>Six modular families · Three equipment tiers · Rigid articulation</p></header>
<main><aside><label for="family">Family</label><select id="family"><option>Needle</option><option>Rotor</option><option>Kiln</option><option>Quiver</option><option>Lancer</option><option>Relay</option></select><label for="tier">Equipment tier</label><select id="tier"><option value="1">01 — Base</option><option value="2">02 — Reinforced</option><option value="3">03 — Maximum</option></select><label for="yaw">Turret yaw</label><input id="yaw" type="range" min="-180" max="180" value="0"><label for="pitch">Elevation</label><input id="pitch" type="range" min="-10" max="65" value="0"><label><input id="clay" type="checkbox"> Silhouette / neutral material</label><button id="recoil">Test recoil</button><br><a id="download" download>Download GLB</a><p style="margin-top:24px">Drag to orbit · Scroll to zoom<br>+Y up · +Z forward<br>Relay is stationary.</p></aside><div id="stage"><p id="status">Loading preview…</p></div></main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const $=id=>document.getElementById(id),stage=$('stage'),scene=new THREE.Scene();scene.background=new THREE.Color('#101820');
const camera=new THREE.PerspectiveCamera(40,1,.01,100);camera.position.set(4,3,5);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(stage.clientWidth,stage.clientHeight);stage.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,.4);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xd9efff,0x34434b,3));const light=new THREE.DirectionalLight(0xffffff,4);light.position.set(3,6,4);scene.add(light);
scene.add(new THREE.GridHelper(10,20,0x4a6572,0x263640));
const loader=new GLTFLoader(),neutral=new THREE.MeshStandardMaterial({color:0xa2adb5,roughness:.7});let model,serial=0,kick=0;
function pose(){if(!model)return;const fixed=$('family').value==='Relay';model.getObjectByName('YAW').rotation.y=fixed?0:THREE.MathUtils.degToRad(+$('yaw').value);model.getObjectByName('PITCH').rotation.x=fixed?0:-THREE.MathUtils.degToRad(+$('pitch').value);model.traverse(o=>{if(o.isMesh)o.material=$('clay').checked?neutral:o.userData.original});}
async function load(){const ticket=++serial,f=$('family').value,t=$('tier').value,url=`assets/${f.toLowerCase()}_t${t}.glb`;$('download').href=url;$('status').textContent='Loading…';try{const gltf=await loader.loadAsync(url);if(ticket!==serial){dispose(gltf.scene);return;}if(model){scene.remove(model);dispose(model);}model=gltf.scene;model.traverse(o=>{if(o.isMesh)o.userData.original=o.material});scene.add(model);kick=0;pose();for(const id of ['yaw','pitch','recoil'])$(id).disabled=f==='Relay';$('status').textContent=`${f} / Tier ${t} · ${f==='Relay'?'Fixed structure':'Articulated turret'}`;}catch(e){$('status').textContent='Preview failed. Serve this folder over HTTP and check internet access for Three.js.';console.error(e);}}
function dispose(root){const materials=new Set();root.traverse(o=>{if(o.isMesh){o.geometry.dispose();materials.add(o.userData.original||o.material)}});materials.forEach(m=>{if(m!==neutral)m.dispose()});}
for(const id of ['family','tier'])$(id).addEventListener('change',load);for(const id of ['yaw','pitch','clay'])$(id).addEventListener('input',pose);$('recoil').onclick=()=>kick=.15;
new ResizeObserver(()=>{camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix();renderer.setSize(stage.clientWidth,stage.clientHeight)}).observe(stage);
const clock=new THREE.Clock();renderer.setAnimationLoop(()=>{const dt=clock.getDelta();kick=Math.max(0,kick-dt*.35);if(model)model.getObjectByName('RECOIL').position.z=-kick;controls.update();renderer.render(scene,camera)});load();
</script></html>
