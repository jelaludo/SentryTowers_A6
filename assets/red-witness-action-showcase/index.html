</style></head><body data-ready="false"><header><div><h1>RED WITNESS / IN MOTION</h1><small>Ten animation studies · native proportions · Jelaludo</small></div><a href="README.txt">Site integration guide ↗</a></header><main id="stage"><canvas id="canvas" aria-label="Animated Red Witness model"></canvas><div id="status">Loading model…</div><div id="error" role="alert"></div></main><footer><label>Movement <select id="movement" aria-label="Movement"></select></label><button id="sequence" aria-pressed="true">Play all</button><button id="pause" aria-pressed="false">Pause</button><label><input id="travel" type="checkbox"> Show travel</label><a href="red-witness-showcase.glb" download>Download GLB</a><span id="credit">Models and adaptations by <a href="https://jelaludo.github.io/SentryTowers_A6/">Jelaludo</a> · <a href="LICENSE.md">License</a></span></footer>
<script type="module">
import * as T from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {loadRedWitnessShowcase} from './red-witness-showcase.js';
const $=id=>document.getElementById(id),renderer=new T.WebGLRenderer({canvas:$('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=T.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();scene.background=new T.Color('#283337');scene.fog=new T.Fog('#283337',14,60);scene.add(new T.HemisphereLight(0xe8eff0,0x737468,2.3));const key=new T.DirectionalLight(0xffe4d4,3.0);key.position.set(3,7,5);key.castShadow=true;key.shadow.mapSize.set(1024,1024);Object.assign(key.shadow.camera,{left:-4,right:4,top:4,bottom:-4,near:.1,far:20});key.shadow.normalBias=.015;scene.add(key,key.target);const rim=new T.DirectionalLight(0xaecad9,2.0);rim.position.set(-3,3,-2);scene.add(rim);
const floor=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshStandardMaterial({color:0x344143,roughness:.92}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const grid=new T.GridHelper(100,100,0x5d6f6b,0x435552);grid.position.y=.001;scene.add(grid);
const camera=new T.PerspectiveCamera(40,1,.025,100);camera.position.set(3.5,2.3,4.8);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.05,0);controls.enableDamping=true;controls.minDistance=2.2;controls.maxDistance=12;controls.maxPolarAngle=Math.PI*.49;controls.update();
new ResizeObserver(()=>{const w=$('stage').clientWidth,h=$('stage').clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}).observe($('stage'));
try{
 const showcase=await loadRedWitnessShowcase(new URL('./',import.meta.url));scene.add(showcase.root);$('movement').replaceChildren(...showcase.manifest.clips.map(c=>new Option(c.label,c.name)));showcase.onChange(name=>{$('movement').value=name;$('status').textContent=showcase.manifest.clips.find(c=>c.name===name).label});
 $('movement').onchange=()=>{showcase.play($('movement').value);$('sequence').setAttribute('aria-pressed','false')};$('sequence').onclick=()=>{showcase.playSequence();$('sequence').setAttribute('aria-pressed','true')};$('pause').onclick=()=>{showcase.setPaused(!showcase.paused);$('pause').textContent=showcase.paused?'Resume':'Pause';$('pause').setAttribute('aria-pressed',String(showcase.paused))};
 const lastFocus=new T.Vector3(),motion=showcase.root.getObjectByName('MOTION');function follow(){showcase.root.updateMatrixWorld(true);const focus=motion.getWorldPosition(new T.Vector3());focus.y=0;const delta=focus.clone().sub(lastFocus);camera.position.add(delta);controls.target.add(delta);key.position.add(delta);key.target.position.add(delta);key.target.updateMatrixWorld();lastFocus.copy(focus)}
 $('travel').onchange=()=>{showcase.setCentered(!$('travel').checked);follow()};let manual=false,last=performance.now(),hiddenPaused=false;
 window.RedWitnessShowcase={ready:true,showcase,scene,camera,renderer,setManual(value=true){manual=value},advance(dt){showcase.update(dt);follow()},render(){follow();controls.update();renderer.render(scene,camera)}};
 document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenPaused=showcase.paused;showcase.setPaused(true)}else showcase.setPaused(hiddenPaused)});
 showcase.playSequence();document.body.dataset.ready='true';renderer.setAnimationLoop(now=>{const dt=Math.min(.05,(now-last)/1000);last=now;if(!manual)showcase.update(dt);follow();controls.update();renderer.render(scene,camera)});
}catch(error){$('error').textContent=error.message;console.error(error)}
