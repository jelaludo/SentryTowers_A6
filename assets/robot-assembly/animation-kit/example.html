<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUREL-03 / Download kit preview</title>
<style>body{margin:0;background:#22343d;color:#ede6d6;font:15px system-ui}header{padding:18px 24px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}h1{font-size:20px;margin:0 auto 0 0}a{color:#e1c783}button,select{background:#304751;color:inherit;border:1px solid #71847b;border-radius:4px;padding:8px}#stage{height:75vh;min-height:400px}canvas{display:block}p{margin:10px 24px;color:#c0cfcd;max-width:900px}#status{color:#e1c783}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head>
<body><header><h1>AUREL-03 / Animation kit</h1><label>Head <select id="head"><option value="frame">Open frame</option><option value="sensor">Sensor crown</option></select></label><label>Detail <select id="lod"><option value="1">Game</option><option value="0">Master</option></select></label><label>Layers <select id="layer"><option value="both">Skeleton + muscles</option><option value="skeleton">Skeleton</option><option value="muscles">Muscles</option></select></label><button id="play">Play joint study</button></header><p id="status" role="status">Loading combined rig…</p><div id="stage"></div><p>This checks the downloaded character and its muscle follow adapter. Generated Kimodo/MotionBricks motion requires retargeting. <a href="README.md">Read the import notes</a>. Drag to orbit; scroll to zoom.</p>
<script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {createCharacter} from './character.js';
const $=id=>document.getElementById(id),stage=$('stage'),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.5;stage.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#22343d');scene.add(new T.HemisphereLight(0xe5f2ff,0x72736b,3));const key=new T.DirectionalLight(0xffeed5,3);key.position.set(3,4,5);scene.add(key);
const camera=new T.PerspectiveCamera(35,1,.01,100);camera.position.set(2,1.5,3.5);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.9,0);controls.update();scene.add(new T.GridHelper(6,30,0x637570,0x344d55));
const loader=new GLTFLoader();let model,character,playing=false,time=0,token=0;
function resize(){renderer.setSize(stage.clientWidth,stage.clientHeight);camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix();}new ResizeObserver(resize).observe(stage);
async function load(){const request=++token;window.kitPreview.ready=false;$('status').textContent='Loading combined rig…';try{const g=await loader.loadAsync(`models/aurel03_${$('head').value}_lod${$('lod').value}.glb`);if(request!==token)return;model?.removeFromParent();model?.traverse(n=>{if(n.isMesh){n.geometry.dispose();n.material.dispose();}});model=g.scene;scene.add(model);model.traverse(n=>{if(n.isMesh)n.frustumCulled=false;});character=createCharacter(model);character.studyPose({articulation:1,time});character.setLayers($('layer').value);window.kitPreview.ready=true;$('status').textContent='Combined rig loaded · original skeleton + 66 muscle bundles';}catch(e){$('status').textContent=e.message;console.error(e);}}
$('head').onchange=load;$('lod').onchange=load;$('layer').onchange=()=>character?.setLayers($('layer').value);$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play joint study';};
const clock=new T.Clock();renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05);if(playing&&character){time=(time+dt)%12;character.studyPose({articulation:1,time});}renderer.render(scene,camera);});
window.kitPreview={ready:false,get model(){return model;},get character(){return character;},get renderer(){return renderer;},get scene(){return scene;},get camera(){return camera;}};await load();
</script></body></html>
